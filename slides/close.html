<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>CatatAI — Penutup</title>
<style>
  :root{
    --bg:#0E1116; --text:#F4F7F9; --muted:#8B98A5; --green:#25D366; --line:#232B35;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{
    background:var(--bg); color:var(--text);
    font-family:Inter,"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .slide{
    position:relative;width:1920px;height:1080px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(1000px 620px at 50% 28%, rgba(37,211,102,.16), transparent 62%),
      radial-gradient(800px 420px at 50% 110%, rgba(37,211,102,.07), transparent 60%),
      var(--bg);
  }
  .mark{
    width:118px;height:118px;border-radius:32px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(37,211,102,.10);
    border:1px solid rgba(37,211,102,.35);
    box-shadow:0 24px 70px rgba(37,211,102,.14);
  }
  .name{
    margin-top:44px;font-size:116px;font-weight:800;letter-spacing:-.045em;line-height:1;
  }
  .tagline{
    margin-top:22px;font-size:40px;color:#C7D0D9;letter-spacing:-.01em;font-weight:500;
  }
  .rule{
    width:120px;height:4px;border-radius:4px;background:var(--green);margin:52px 0 46px;
  }
  .contact{display:flex;align-items:center;gap:34px;font-size:30px;color:#D7DEE5}
  .contact .sep{width:1px;height:32px;background:var(--line)}
  .contact b{font-weight:650;color:var(--text)}
  .pill{
    margin-top:46px;display:inline-flex;align-items:center;gap:14px;
    padding:16px 26px;border:1px solid rgba(37,211,102,.35);border-radius:999px;
    background:rgba(37,211,102,.08);font-size:24px;color:#B9F5CE;letter-spacing:.01em;
  }
  .pill .live{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(37,211,102,.14)}
  .footer{
    position:absolute;bottom:54px;left:0;right:0;text-align:center;
    font-size:20px;color:#6F7C89;letter-spacing:.06em;
  }
</style>
</head>
<body>
  <main class="slide">
    <div class="mark" aria-hidden="true">
      <svg width="62" height="62" viewBox="0 0 24 24" fill="none">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
          stroke="#25D366" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="name">CatatAI</h1>
    <p class="tagline">WhatsApp back-office untuk UMKM Indonesia</p>

    <div class="rule"></div>

    <div class="contact">
      <span><b>catatai.ardianova.com</b></span>
      <span class="sep"></span>
      <span><b>+62 851-5806-4660</b></span>
    </div>

    <div class="pill"><span class="live"></span>Live di WhatsApp · app Published</div>

    <div class="footer">META GLOBAL AI DEVELOPER HACKATHON 2026 · INDIE TRACK</div>
  </main>
</body>
</html>
